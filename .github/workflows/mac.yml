name: Mac (iOS 18)

# 试验：把最低系统版本降到 iOS 18，编译真机版本（arm64，不签名），看能否在 macOS 15 上以「为 iPad 设计」方式运行。
# 最低版本只在命令行覆盖，源码和工程文件与私有仓库一致。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || { ls -d /Applications/Xcode*; exit 1; }
          xcodebuild -version

      - name: 缓存 Swift 包
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Learning.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 编译（最低 iOS 18，真机 Debug，不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Learning.xcodeproj \
            -scheme Learning \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)' || true
          echo "::group::去重后的错误"
          grep -E '^/.*error:' xcodebuild.log | sed -E 's#^.*/Learning/#Learning/#' | sort -u || true
          echo "::endgroup::"
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: 打包
        run: |
          APP=build/Build/Products/Debug-iphoneos/Learning.app
          plutil -p "$APP/Info.plist" | grep -E 'MinimumOSVersion|UIDeviceFamily' -A2
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Learning-ios18-unsigned.ipa Payload && rm -rf Payload)
          cp SOURCE_REV out/

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: Learning-ios18
          path: out/
          retention-days: 30

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
